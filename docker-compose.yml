# ---------------------------------------------------------------------------
# Local + single-host production compose.
#
#   docker compose up --build
#
# then http://localhost:8080  (dashboard, proxied to backend)
#       http://localhost:8000/healthz
#       http://localhost:8000/metrics
# ---------------------------------------------------------------------------
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # No published port by default — the backend reaches Redis on the
    # internal network. Uncomment to poke at it from the host.
    # ports:
    #   - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DATA_SOURCE: mock
      SYMBOLS: RELIANCE,TCS,HDFCBANK,INFY,ICICIBANK
      REDIS_URL: redis://redis:6379/0
      LOG_JSON: "1"
      LOG_LEVEL: INFO
      # In production, set this to your dashboard's origin, not "*".
      CORS_ALLOW_ORIGINS: "*"
      TICK_STORE_DIR: /app/data/ticks
      PARQUET_ROLL_MINUTES: "15"
      # WS auth: set this to a long random string in production. Leaving it
      # empty leaves the WebSocket endpoints open (dev convenience).
      WS_AUTH_TOKEN: ${WS_AUTH_TOKEN:-}
      HTTP_RATE_LIMIT_PER_MINUTE: "120"
    volumes:
      - ticks:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  ticks:
