# nginx config for the built dashboard.
# Serves the SPA and reverse-proxies /api and /ws to the backend service.

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # SPA: serve index.html for any unknown route so client-side routing works.
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API
    location /api/ {
        proxy_pass         http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /healthz {
        proxy_pass http://backend/healthz;
    }
    location /metrics {
        # Restrict to your monitoring subnet in production.
        proxy_pass http://backend/metrics;
    }

    # WebSocket upgrade for /ws/...
    location /ws/ {
        proxy_pass         http://backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
