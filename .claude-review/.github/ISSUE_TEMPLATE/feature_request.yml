name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
body:
  - type: checkboxes
    attributes:
      label: Preliminary checks
      options:
        - label: I searched existing open and closed issues.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
  - type: textarea
    id: need
    attributes:
      label: Problem or research need
      description: Explain the user or research problem, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe the design, assumptions, and expected outputs.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention related tools or simpler approaches considered.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Explain how correctness and reproducibility could be tested.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context or references

