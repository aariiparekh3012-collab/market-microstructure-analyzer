name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
body:
  - type: checkboxes
    attributes:
      label: Preliminary checks
      options:
        - label: I searched existing open and closed issues.
          required: true
        - label: I removed credentials, personal data, and proprietary data.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Analytics
        - API or WebSockets
        - Data ingestion
        - Backtesting or execution simulation
        - Frontend dashboard
        - Research notebooks
        - Installation or documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe the actual behaviour and why it appears incorrect.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest deterministic example possible.
      placeholder: |
        1. Install...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.1 or commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python version, Node.js version, and installation method.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and sensitive data before pasting logs.
      render: shell

