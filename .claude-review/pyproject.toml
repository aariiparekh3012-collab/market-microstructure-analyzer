[project]
name = "market-microstructure-backend"
version = "0.1.0"
description = "Real-time market microstructure analyzer for Indian equities"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "scipy>=1.13.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]
research = [
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "statsmodels>=0.14.0",
    "jupyterlab>=4.2.0",
]
live = [
    "yfinance>=0.2.40",
    "smartapi-python>=1.4.0",
    "pyotp>=2.9.0",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "market_microstructure*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", ".snapshots", "demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
addopts = "-ra"
